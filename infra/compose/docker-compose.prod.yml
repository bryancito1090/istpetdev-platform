# ==============================================================================
# docker-compose.prod.yml
# Despliegue de producción para IstpetDev Platform
# Host: AWS EC2 Debian / VPS
# Dominio: istpetdev.doicela.dev (con Cloudflare)
# ==============================================================================

services:
  istpetdev-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: istpetdev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-istpetdev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-istpetdev_db}
    volumes:
      - istpetdev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-istpetdev_user} -d ${DB_NAME:-istpetdev_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istpetdev-net

  istpetdev-redis:
    image: redis:7.4-alpine
    container_name: istpetdev-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - istpetdev-net

  istpetdev-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/bryancito1090/istpetdev-backend:latest}
    container_name: istpetdev-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Main: Host=istpetdev-db;Port=5432;Database=${DB_NAME:-istpetdev_db};Username=${DB_USER:-istpetdev_user};Password=${DB_PASSWORD:-postgres_secure_pass_2026};
      Cors__Origins__0: https://istpetdev.doicela.dev
      Cors__Origins__1: https://clean.doicela.dev
      Cors__Origins__2: http://localhost:4200
    depends_on:
      istpetdev-db:
        condition: service_healthy
      istpetdev-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - istpetdev-net

  istpetdev-web:
    image: ${FRONTEND_IMAGE:-ghcr.io/bryancito1090/istpetdev-web:latest}
    container_name: istpetdev-web
    restart: unless-stopped
    depends_on:
      - istpetdev-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - istpetdev-net

  istpetdev-proxy:
    image: nginx:alpine
    container_name: istpetdev-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/istpetdev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - istpetdev-backend
      - istpetdev-web
    networks:
      - istpetdev-net

networks:
  istpetdev-net:
    driver: bridge

volumes:
  istpetdev_pgdata:
