# ==============================================================================
# docker-compose.prod.yml
# Despliegue de produccion para IstpetDev Platform (Perfil A Reforzado)
# Host: AWS EC2 en istpetdev-vpc-dev (10.42.0.0/16) - RDS PostgreSQL 16
# Dominio: istpetdev.doicela.dev (con Cloudflare)
# ==============================================================================

services:
  istpetdev-redis:
    image: redis:7.4-alpine
    container_name: istpetdev-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - istpetdev-net

  istpetdev-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/bryancito1090/istpetdev-backend:latest}
    container_name: istpetdev-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Main: Host=${DB_HOST:-istpetdev-rds-dev.cep4osawemm3.us-east-1.rds.amazonaws.com};Port=${DB_PORT:-5432};Database=${DB_NAME:-istpetdev_integration};Username=${DB_USER:-migrator_integration};Password=${DB_PASSWORD};SSL Mode=${DB_SSL_MODE:-Require};Trust Server Certificate=true;
      Cors__Origins__0: https://istpetdev.doicela.dev
      Cors__Origins__1: https://clean.doicela.dev
      Cors__Origins__2: http://localhost:4200
      Cors__Origins__3: http://localhost:8100
      ApplyMigrations: ${APPLY_MIGRATIONS:-true}
      Demo__Enabled: ${DEMO_ENABLED:-false}
      Demo__FixturePath: /app/data/fixtures/demo-base
      Authentication__Authority: ${COGNITO_AUTHORITY:-}
      Authentication__AllowedClientIds__0: ${COGNITO_WEB_CLIENT_ID:-}
      Authentication__AllowedClientIds__1: ${COGNITO_MOBILE_CLIENT_ID:-}
      EnableSwagger: "true"
    depends_on:
      istpetdev-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - istpetdev-net

  istpetdev-web:
    image: ${FRONTEND_IMAGE:-ghcr.io/bryancito1090/istpetdev-web:latest}
    container_name: istpetdev-web
    restart: unless-stopped
    depends_on:
      - istpetdev-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - istpetdev-net

  istpetdev-proxy:
    image: nginx:alpine
    container_name: istpetdev-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/istpetdev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - istpetdev-backend
      - istpetdev-web
    networks:
      - istpetdev-net

networks:
  istpetdev-net:
    driver: bridge
