name: "Escaneo de Secretos"

# GitGuardian (ggshield) revisa los commits nuevos de cada PR y push en busca de credenciales.
# Sin filtro de rutas: un secreto puede filtrarse en cualquier archivo, también en docs.
# Requiere el secreto de repositorio GITGUARDIAN_API_KEY (token de dashboard.gitguardian.com).

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ggshield:
    name: "GitGuardian (secretos)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout con historial"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Escanear commits con ggshield"
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
