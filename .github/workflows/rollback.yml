name: "Rollback Rápido (<30s)"

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA al que se desea revertir (ej. b38b073 o hash completo)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

# Comparte grupo con deploy.yml: un rollback y un despliegue nunca tocan el host a la vez.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-source:
    name: "Validar Rama de Ejecución"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del script de política"
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: "Validar que el rollback se ejecuta sobre main"
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/branch-policy.sh dispatch "$BRANCH"

  # Solo se puede volver a una versión de main que ya se desplegó con éxito (pruebas en verde).
  resolve-target:
    name: "Validar Versión Destino"
    needs: validate-source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: "Checkout con historial"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Resolver SHA y exigir un despliegue previo exitoso"
        id: resolve
        env:
          TARGET: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$TARGET" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::target_sha debe ser un hash hexadecimal de 7 a 40 caracteres."
            exit 1
          fi
          if ! FULL=$(git rev-parse --verify --quiet "${TARGET}^{commit}"); then
            echo "::error::El commit $TARGET no existe en el repositorio (o el hash corto es ambiguo)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FULL" origin/main; then
            echo "::error::El commit $FULL no forma parte de la historia de main."
            exit 1
          fi
          DEPLOYED=0
          for run in $(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$FULL&status=success&per_page=20" -q '.workflow_runs[].id'); do
            if gh api "repos/$REPO/actions/runs/$run/jobs" -q '.jobs[] | select(.name == "Despliegue Inmutable en Servidor EC2" and .conclusion == "success") | .id' | grep -q .; then
              DEPLOYED=1; break
            fi
          done
          if [ "$DEPLOYED" != "1" ]; then
            echo "::error::El commit $FULL nunca se desplegó con éxito (QA y despliegue en verde); no se permite volver a él."
            exit 1
          fi
          echo "Versión destino validada: $FULL"
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"

  rollback:
    name: "Ejecutar Rollback en el Host"
    needs: resolve-target
    runs-on: ubuntu-latest
    steps:
      - name: "Ejecutar reversión de versión vía SSH"
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST || 'istpetdev-rds-dev.cep4osawemm3.us-east-1.rds.amazonaws.com' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME || 'istpetdev_integration' }}
          DB_USER: ${{ secrets.DB_USER || 'migrator_integration' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE || 'VerifyFull' }}
          COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          COGNITO_WEB_CLIENT_ID: ${{ vars.COGNITO_WEB_CLIENT_ID }}
          COGNITO_MOBILE_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID }}
          COGNITO_M2M_CLIENT_ID: ${{ vars.COGNITO_M2M_CLIENT_ID }}
          AUTHENTICATION_TECHNICAL_READ_SCOPE: ${{ vars.AUTHENTICATION_TECHNICAL_READ_SCOPE || 'istpetdev-api/automation' }}
          DEMO_ENABLED: ${{ vars.DEMO_ENABLED || 'false' }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'false' }}
          AGENT_AUTO_ON_INCIDENT: ${{ vars.AGENT_AUTO_ON_INCIDENT || 'true' }}
          AGENT_TIMEOUT_SECONDS: ${{ vars.AGENT_TIMEOUT_SECONDS || '10' }}
          AGENT_POLL_MILLISECONDS: ${{ vars.AGENT_POLL_MILLISECONDS || '250' }}
          AGENT_N8N_WEBHOOK_URL: ${{ vars.AGENT_N8N_WEBHOOK_URL || 'https://n8n.bryan-bano.com/webhook/istpetdev/agent' }}
          AGENT_N8N_WEBHOOK_SECRET: ${{ secrets.AGENT_N8N_WEBHOOK_SECRET }}
          AGENT_N8N_API_BASE_URL: ${{ vars.AGENT_N8N_API_BASE_URL || 'https://istpetdev.doicela.dev/api/v1' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TARGET_SHA,OWNER,GH_ACTOR,GH_TOKEN,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,DB_SSL_MODE,COGNITO_AUTHORITY,COGNITO_WEB_CLIENT_ID,COGNITO_MOBILE_CLIENT_ID,COGNITO_M2M_CLIENT_ID,AUTHENTICATION_TECHNICAL_READ_SCOPE,DEMO_ENABLED,AGENT_ENABLED,AGENT_AUTO_ON_INCIDENT,AGENT_TIMEOUT_SECONDS,AGENT_POLL_MILLISECONDS,AGENT_N8N_WEBHOOK_URL,AGENT_N8N_WEBHOOK_SECRET,AGENT_N8N_API_BASE_URL
          script: |
            set -e
            cd /var/www/istpetdev

            # Inicio de configuración de base de datos (la reaplicación debe reproducir el env del deploy)
            if [ -z "$DB_PASSWORD" ] && [ -f .env ]; then
              echo "Cargando DB_PASSWORD desde archivo .env persistente en host..."
              export DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2-)
            fi
            export DB_HOST="${DB_HOST:-istpetdev-rds-dev.cep4osawemm3.us-east-1.rds.amazonaws.com}"
            export DB_PORT="${DB_PORT:-5432}"
            export DB_NAME="${DB_NAME:-istpetdev_integration}"
            export DB_USER="${DB_USER:-migrator_integration}"
            export DB_PASSWORD="$DB_PASSWORD"
            export DB_SSL_MODE="${DB_SSL_MODE:-VerifyFull}"
            export APPLY_MIGRATIONS="${APPLY_MIGRATIONS:-true}"
            if [ -z "$DB_PASSWORD" ]; then
              echo 'DB_PASSWORD no disponible: la recreación dejaría el backend sin credenciales. Abortando.' >&2
              exit 1
            fi
            # Fin de configuración de base de datos

            # Inicio de configuración del agente
            export COGNITO_M2M_CLIENT_ID="${COGNITO_M2M_CLIENT_ID:-}"
            export AUTHENTICATION_TECHNICAL_READ_SCOPE="${AUTHENTICATION_TECHNICAL_READ_SCOPE:-istpetdev-api/automation}"
            export DEMO_ENABLED="${DEMO_ENABLED:-false}"
            case "$DEMO_ENABLED" in
              true|false) ;;
              *) echo 'DEMO_ENABLED debe ser true o false.' >&2; exit 1 ;;
            esac
            export AGENT_ENABLED="${AGENT_ENABLED:-false}"
            export AGENT_AUTO_ON_INCIDENT="${AGENT_AUTO_ON_INCIDENT:-true}"
            export AGENT_TIMEOUT_SECONDS="${AGENT_TIMEOUT_SECONDS:-10}"
            export AGENT_POLL_MILLISECONDS="${AGENT_POLL_MILLISECONDS:-250}"
            export AGENT_N8N_WEBHOOK_URL="${AGENT_N8N_WEBHOOK_URL:-https://n8n.bryan-bano.com/webhook/istpetdev/agent}"
            export AGENT_N8N_WEBHOOK_SECRET="${AGENT_N8N_WEBHOOK_SECRET:-}"
            export AGENT_N8N_API_BASE_URL="${AGENT_N8N_API_BASE_URL:-https://istpetdev.doicela.dev/api/v1}"
            case "$AGENT_ENABLED" in
              true)
                if [ -z "$COGNITO_M2M_CLIENT_ID" ] || [ -z "$AGENT_N8N_WEBHOOK_URL" ] || [ -z "$AGENT_N8N_WEBHOOK_SECRET" ]; then
                  echo 'Configurar COGNITO_M2M_CLIENT_ID, AGENT_N8N_WEBHOOK_URL y AGENT_N8N_WEBHOOK_SECRET antes de activar el agente.' >&2
                  exit 1
                fi
                ;;
              false) ;;
              *) echo 'AGENT_ENABLED debe ser true o false.' >&2; exit 1 ;;
            esac
            # Fin de configuración del agente

            # 1. Mantenimiento preventivo de disco
            docker image prune -f
            sudo journalctl --vacuum-size=20M 2>/dev/null || true

            # 2. Autenticación en GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-backend:${TARGET_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-web:${TARGET_SHA}"

            echo "Descargando imágenes inmutables para la versión ${TARGET_SHA}..."
            docker compose -f infra/compose/docker-compose.prod.yml pull --quiet

            echo "Restaurando servicios de aplicación a la versión ${TARGET_SHA}..."
            docker compose -f infra/compose/docker-compose.prod.yml up -d --remove-orphans istpetdev-backend istpetdev-web
            docker image prune -f

            # 3. Verificación estricta de readiness tras rollback (/health/ready)
            echo "Verificando readiness del backend y conexión a RDS tras el rollback..."
            READY=false
            for i in $(seq 1 10); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/health/ready || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                READY=true
                echo "Rollback completado y verificado exitosamente en el intento $i (HTTP 200 en /health/ready)."
                break
              fi
              echo "Esperando readiness tras rollback (intento $i/10, status=$HTTP_STATUS)..."
              sleep 3
            done

            if [ "$READY" != "true" ]; then
              echo "Error critico: El backend no alcanzo estado READY tras el rollback a ${TARGET_SHA}."
              docker compose -f infra/compose/docker-compose.prod.yml logs --tail=50 istpetdev-backend
              exit 1
            fi

      - name: "Generar Reporte de Rollback en GitHub Step Summary"
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # Reporte Ejecutivo de Rollback — IstpetDev

          | Parámetro | Valor |
          | :--- | :--- |
          | **Estado** | Rollback Ejecutado Exitosamente |
          | **Dominio Público** | [https://istpetdev.doicela.dev](https://istpetdev.doicela.dev) |
          | **Target Commit SHA** | \`${TARGET_SHA}\` |
          | **Ejecutado por** | @${ACTOR} |
          | **Verificación Base de Datos** | Exitoso (HTTP 200 en \`/health/ready\`) |

          ### Nota Operativa:
          Se restauraron los contenedores en producción a la imagen inmutable correspondiente a \`${TARGET_SHA}\` en menos de 30 segundos, validando conectividad efectiva con Amazon RDS sin degradación de base de datos.
          EOF
