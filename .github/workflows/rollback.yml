name: "Rollback Rápido (<30s)"

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA al que se desea revertir (ej. b38b073 o hash completo)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    name: "Validar Rama de Ejecución"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del script de política"
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: "Validar que el rollback se ejecuta sobre main"
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/branch-policy.sh dispatch "$BRANCH"

  rollback:
    name: "Ejecutar Rollback en el Host"
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - name: "Ejecutar reversión de versión vía SSH"
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          OWNER: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          COGNITO_WEB_CLIENT_ID: ${{ vars.COGNITO_WEB_CLIENT_ID }}
          COGNITO_MOBILE_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID }}
          COGNITO_M2M_CLIENT_ID: ${{ vars.COGNITO_M2M_CLIENT_ID }}
          AUTHENTICATION_TECHNICAL_READ_SCOPE: ${{ vars.AUTHENTICATION_TECHNICAL_READ_SCOPE || 'istpetdev-api/automation' }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'false' }}
          AGENT_AUTO_ON_INCIDENT: ${{ vars.AGENT_AUTO_ON_INCIDENT || 'true' }}
          AGENT_TIMEOUT_SECONDS: ${{ vars.AGENT_TIMEOUT_SECONDS || '10' }}
          AGENT_POLL_MILLISECONDS: ${{ vars.AGENT_POLL_MILLISECONDS || '250' }}
          AGENT_N8N_WEBHOOK_URL: ${{ vars.AGENT_N8N_WEBHOOK_URL || 'https://n8n.bryan-bano.com/webhook/istpetdev/agent' }}
          AGENT_N8N_WEBHOOK_SECRET: ${{ secrets.AGENT_N8N_WEBHOOK_SECRET }}
          AGENT_N8N_API_BASE_URL: ${{ vars.AGENT_N8N_API_BASE_URL || 'https://istpetdev.doicela.dev/api/v1' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TARGET_SHA,OWNER,GH_ACTOR,GH_TOKEN,COGNITO_AUTHORITY,COGNITO_WEB_CLIENT_ID,COGNITO_MOBILE_CLIENT_ID,COGNITO_M2M_CLIENT_ID,AUTHENTICATION_TECHNICAL_READ_SCOPE,AGENT_ENABLED,AGENT_AUTO_ON_INCIDENT,AGENT_TIMEOUT_SECONDS,AGENT_POLL_MILLISECONDS,AGENT_N8N_WEBHOOK_URL,AGENT_N8N_WEBHOOK_SECRET,AGENT_N8N_API_BASE_URL
          script: |
            set -e
            cd /var/www/istpetdev

            # Inicio de configuración del agente
            export COGNITO_M2M_CLIENT_ID="${COGNITO_M2M_CLIENT_ID:-}"
            export AUTHENTICATION_TECHNICAL_READ_SCOPE="${AUTHENTICATION_TECHNICAL_READ_SCOPE:-istpetdev-api/automation}"
            export AGENT_ENABLED="${AGENT_ENABLED:-false}"
            export AGENT_AUTO_ON_INCIDENT="${AGENT_AUTO_ON_INCIDENT:-true}"
            export AGENT_TIMEOUT_SECONDS="${AGENT_TIMEOUT_SECONDS:-10}"
            export AGENT_POLL_MILLISECONDS="${AGENT_POLL_MILLISECONDS:-250}"
            export AGENT_N8N_WEBHOOK_URL="${AGENT_N8N_WEBHOOK_URL:-https://n8n.bryan-bano.com/webhook/istpetdev/agent}"
            export AGENT_N8N_WEBHOOK_SECRET="${AGENT_N8N_WEBHOOK_SECRET:-}"
            export AGENT_N8N_API_BASE_URL="${AGENT_N8N_API_BASE_URL:-https://istpetdev.doicela.dev/api/v1}"
            case "$AGENT_ENABLED" in
              true)
                if [ -z "$COGNITO_M2M_CLIENT_ID" ] || [ -z "$AGENT_N8N_WEBHOOK_URL" ] || [ -z "$AGENT_N8N_WEBHOOK_SECRET" ]; then
                  echo 'Configurar COGNITO_M2M_CLIENT_ID, AGENT_N8N_WEBHOOK_URL y AGENT_N8N_WEBHOOK_SECRET antes de activar el agente.' >&2
                  exit 1
                fi
                ;;
              false) ;;
              *) echo 'AGENT_ENABLED debe ser true o false.' >&2; exit 1 ;;
            esac
            # Fin de configuración del agente

            # 1. Mantenimiento preventivo de disco
            docker image prune -f
            sudo journalctl --vacuum-size=20M 2>/dev/null || true

            # 2. Autenticación en GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-backend:${TARGET_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-web:${TARGET_SHA}"

            echo "Descargando imágenes inmutables para la versión ${TARGET_SHA}..."
            docker compose -f infra/compose/docker-compose.prod.yml pull --quiet

            echo "Restaurando servicios de aplicación a la versión ${TARGET_SHA}..."
            docker compose -f infra/compose/docker-compose.prod.yml up -d --remove-orphans istpetdev-backend istpetdev-web
            docker image prune -f

            # 3. Verificación estricta de readiness tras rollback (/health/ready)
            echo "Verificando readiness del backend y conexión a RDS tras el rollback..."
            READY=false
            for i in $(seq 1 10); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/health/ready || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                READY=true
                echo "Rollback completado y verificado exitosamente en el intento $i (HTTP 200 en /health/ready)."
                break
              fi
              echo "Esperando readiness tras rollback (intento $i/10, status=$HTTP_STATUS)..."
              sleep 3
            done

            if [ "$READY" != "true" ]; then
              echo "Error critico: El backend no alcanzo estado READY tras el rollback a ${TARGET_SHA}."
              docker compose -f infra/compose/docker-compose.prod.yml logs --tail=50 istpetdev-backend
              exit 1
            fi

      - name: "Generar Reporte de Rollback en GitHub Step Summary"
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Reporte Ejecutivo de Rollback — IstpetDev

          | Parámetro | Valor |
          | :--- | :--- |
          | **Estado** | Rollback Ejecutado Exitosamente |
          | **Dominio Público** | [https://istpetdev.doicela.dev](https://istpetdev.doicela.dev) |
          | **Target Commit SHA** | `${{ inputs.target_sha }}` |
          | **Ejecutado por** | @${{ github.actor }} |
          | **Verificación Base de Datos** | Exitoso (HTTP 200 en `/health/ready`) |

          ### Nota Operativa:
          Se restauraron los contenedores en producción a la imagen inmutable correspondiente a `${{ inputs.target_sha }}` en menos de 30 segundos, validando conectividad efectiva con Amazon RDS sin degradación de base de datos.
          EOF
