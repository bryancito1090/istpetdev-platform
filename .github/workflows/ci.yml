name: "CI - Integración Continua"

on:
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"
      - ".nvmrc"
      - ".npm-version"
      - ".npmrc"
      - "security/**"
      - ".github/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"
      - ".nvmrc"
      - ".npm-version"
      - ".npmrc"
      - "security/**"
      - ".github/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: "QA Backend (.NET 8)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar .NET SDK 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restaurar dependencias NuGet"
        run: dotnet restore IstpetDev.sln

      - name: "Compilar solución en Release"
        run: dotnet build IstpetDev.sln -c Release --no-restore

      - name: "Verificar núcleo, importador y HTTP con PostGIS descartable"
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          for category in Unit Integration E2E; do
            dotnet test tests/IstpetDev.Tests -c Release --no-build --no-restore --filter "Category=$category" --logger "trx;LogFileName=$category.trx" --results-directory artifacts/spec001
          done
          python scripts/db/check-test-results.py artifacts/spec001

      - name: "Conservar resultados de pruebas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-ci-tests
          path: artifacts/spec001/*.trx

  frontend-qa:
    name: "QA Frontend (Angular 22)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js desde .nvmrc"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: "Validar versiones fijadas de Node y npm"
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(cat .npm-version)"

      - name: "Instalar dependencias npm"
        run: npm ci

      - name: "Verificar auditoría de dependencias y vulnerabilidades"
        run: npm run audit:check

      - name: "Compilar librería compartida"
        run: npm run build:shared

      - name: "Verificar linteo de frontend"
        run: npm run lint:web

      - name: "Compilar aplicación Web en Producción"
        run: npm run build:web

      - name: "Sin login simulado (NFR-04 de 013)"
        run: npm run check:no-mock-login

      - name: "Pruebas unitarias frontend (shared-core, web y PWA)"
        run: npm run test:frontend

      - name: "Compilar PWA en Producción"
        run: npm run build:mobile

      - name: "Verificar artefactos de PWA Campo (/campo/)"
        run: node scripts/ci/check-campo-build.mjs

      - name: "Conservar el reporte de auditoría"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.job }}
          path: artifacts/spec000/audit-ci.json
          if-no-files-found: warn
