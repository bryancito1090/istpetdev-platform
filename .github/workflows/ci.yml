name: "CI - Integración Continua"

on:
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - "scripts/agent/**"
      - "scripts/base_datos/**"
      - "scripts/backup/**"
      - "scripts/ops/dev.py"
      - "automation/n8n/**"
      - "infra/compose/docker-compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"
      - ".nvmrc"
      - ".npm-version"
      - ".npmrc"
      - "security/**"
      - ".github/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - "scripts/agent/**"
      - "scripts/base_datos/**"
      - "scripts/backup/**"
      - "scripts/ops/dev.py"
      - "automation/n8n/**"
      - "infra/compose/docker-compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"
      - ".nvmrc"
      - ".npm-version"
      - ".npmrc"
      - "security/**"
      - ".github/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Integración es la categoría más larga; Unit y E2E corren a la vez en otro runner.
  backend-tests:
    name: "Pruebas Backend (${{ matrix.label }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Integración"
            slug: integration
            categories: "Integration"
          - label: "Unit y E2E"
            slug: unit-e2e
            categories: "Unit E2E"
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar .NET SDK 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restaurar dependencias NuGet"
        run: dotnet restore IstpetDev.sln

      - name: "Compilar solución en Release"
        run: dotnet build IstpetDev.sln -c Release --no-restore

      - name: "Verificar núcleo, importador y HTTP con PostGIS descartable"
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
          CATEGORIES: ${{ matrix.categories }}
        run: |
          for category in $CATEGORIES; do
            dotnet test tests/IstpetDev.Tests -c Release --no-build --no-restore --filter "Category=$category" --logger "trx;LogFileName=$category.trx" --results-directory artifacts/spec001
          done

      - name: "Conservar resultados de pruebas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-ci-tests-${{ matrix.slug }}
          path: artifacts/spec001/*.trx

  # Ensayo de respaldo y restauración (#15): PostGIS desechable con TLS, migración por el camino
  # de producción (API --migrate), pg_dump con cliente 16, restauración aislada y hash por tabla.
  db-backup-rehearsal:
    name: "Ensayo de respaldo y restauración"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar .NET SDK 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Compilar la API en Debug (la usa el migrador)"
        run: dotnet build src/Api/IstpetDev.Api.csproj -c Debug

      - name: "Cliente psql disponible"
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: "Bootstrap, migración, respaldo y restauración verificada"
        run: python3 scripts/base_datos/test-bootstrap.py

  # Conserva el nombre del check histórico y valida que todas las categorías corrieron y pasaron.
  backend-qa:
    name: "QA Backend (.NET 8)"
    needs: backend-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: "Exigir que todas las pruebas backend terminaran bien"
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Las pruebas backend terminaron con estado: $RESULT"
            exit 1
          fi

      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Reunir resultados de pruebas"
        uses: actions/download-artifact@v4
        with:
          pattern: spec001-ci-tests-*
          path: artifacts/spec001
          merge-multiple: true

      - name: "Validar categorías Unit, Integration y E2E"
        run: python scripts/db/check-test-results.py artifacts/spec001

      # El rollback no revierte la base: una migración nueva debe ser aditiva (Runbook §8).
      - name: "Verificar que las migraciones nuevas son aditivas"
        run: python3 -I scripts/db/check-additive-migrations.py

      - name: "Verificar generación n8n, aceptación y limpieza sin credenciales"
        run: |
          python3 -I scripts/agent/build-workflows.py --check
          for test_script in tests/scripts/test_*.py; do
            python3 -I "$test_script"
          done

      - name: "Conservar resultados de pruebas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-ci-tests
          path: artifacts/spec001/*.trx

  frontend-qa:
    name: "QA Frontend (Angular 22)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js desde .nvmrc"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: "Validar versiones fijadas de Node y npm"
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(cat .npm-version)"

      - name: "Instalar dependencias npm"
        run: npm ci

      - name: "Verificar auditoría de dependencias y vulnerabilidades"
        run: npm run audit:check

      - name: "Compilar librería compartida"
        run: npm run build:shared

      - name: "Verificar linteo de frontend"
        run: npm run lint:web

      - name: "Compilar aplicación Web en Producción"
        run: npm run build:web

      - name: "Sin login simulado (NFR-04 de 013)"
        run: npm run check:no-mock-login

      - name: "Pruebas unitarias frontend (shared-core, web y PWA)"
        run: npm run test:frontend

      - name: "Compilar PWA en Producción"
        run: npm run build:mobile

      - name: "Verificar artefactos de PWA Campo (/campo/)"
        run: node scripts/ci/check-campo-build.mjs

      - name: "Conservar el reporte de auditoría"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.job }}
          path: artifacts/spec000/audit-ci.json
          if-no-files-found: warn
