name: "CI - Integración Continua"

on:
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/**"
      - "libs/**"
      - "package*.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: "QA Backend (.NET 8)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar .NET SDK 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restaurar dependencias NuGet"
        run: dotnet restore IstpetDev.sln

      - name: "Compilar solución en Release"
        run: dotnet build IstpetDev.sln -c Release --no-restore

      - name: "Verificar núcleo, importador y HTTP con PostGIS descartable"
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          for category in Unit Integration E2E; do
            dotnet test tests/IstpetDev.Tests -c Release --no-build --no-restore --filter "Category=$category" --logger "trx;LogFileName=$category.trx" --results-directory artifacts/spec001
          done
          python scripts/db/check-test-results.py artifacts/spec001

      - name: "Verificar generación n8n, aceptación y limpieza sin credenciales"
        run: |
          python3 -I scripts/agent/build-workflows.py --check
          for test_script in tests/scripts/test_*.py; do
            python3 -I "$test_script"
          done

      - name: "Conservar resultados de pruebas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-ci-tests
          path: artifacts/spec001/*.trx

  frontend-qa:
    name: "QA Frontend (Angular 22)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js 22 LTS"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: "Instalar dependencias npm"
        run: npm ci

      - name: "Compilar librería compartida"
        run: npm run build:shared

      - name: "Verificar linteo de frontend"
        run: npm run lint:web

      - name: "Compilar aplicación Web en Producción"
        run: npm run build:web
