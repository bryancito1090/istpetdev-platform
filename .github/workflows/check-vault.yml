name: "CI - Verificación de Bóveda"

on:
  push:
    branches: [develop]
    paths:
      - "docs/boveda/**"
  pull_request:
    branches: [develop]
    paths:
      - "docs/boveda/**"

permissions:
  contents: read

jobs:
  check-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar enlaces, IDs y frontmatter
        run: python docs/boveda/.github/scripts/check_vault.py
