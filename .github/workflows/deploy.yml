name: "CD - Despliegue en Producción"

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/db/**"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - "global.json"
      - "IstpetDev.sln"
      - "data/fixtures/**"
      - "tests/**"
      - "apps/web/**"
      - "apps/mobile/**"
      - "libs/shared-core/**"
      - "infra/**"
      - "package*.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      restart_only:
        description: "Reiniciar contenedores en el servidor sin recompilar imágenes"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /var/www/istpetdev

jobs:
  validate-source:
    name: "Validar Origen del Despliegue"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "Checkout del script de política"
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # Push: solo merges de PR desde develop o hotfix/*. Manual: solo sobre main.
      - name: "Validar rama de origen (política de ramas)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ]; then
            bash .github/scripts/branch-policy.sh push "$BRANCH" "$SHA" "$REPO"
          else
            bash .github/scripts/branch-policy.sh dispatch "$BRANCH"
          fi

  quick-restart:
    name: "Reinicio Rápido"
    needs: validate-source
    if: ${{ inputs.restart_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: "Ejecutar reinicio de servicios vía SSH"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            echo "Reiniciando servicios de aplicación..."
            docker compose -f infra/compose/docker-compose.prod.yml restart istpetdev-backend istpetdev-web
            sleep 5
            (curl -sf http://127.0.0.1:5000/health/ready || curl -sf http://localhost/health/ready) && echo "Servicios reiniciados correctamente"

  backend-qa:
    name: "QA Backend (.NET 8)"
    needs: validate-source
    if: ${{ inputs.restart_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar .NET SDK 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restaurar dependencias NuGet"
        run: dotnet restore IstpetDev.sln

      - name: "Compilar solución en Release"
        run: dotnet build IstpetDev.sln -c Release --no-restore

      - name: "Verificar núcleo, importador y recorrido HTTP"
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          for category in Unit Integration E2E; do
            dotnet test tests/IstpetDev.Tests -c Release --no-build --no-restore --filter "Category=$category" --logger "trx;LogFileName=$category.trx" --results-directory artifacts/spec001
          done
          python scripts/db/check-test-results.py artifacts/spec001

      - name: "Verificar generación n8n, aceptación y limpieza sin credenciales"
        run: |
          python3 -I scripts/agent/build-workflows.py --check
          for test_script in tests/scripts/test_*.py; do
            python3 -I "$test_script"
          done

      - name: "Conservar resultados de pruebas"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec001-cd-tests
          path: artifacts/spec001/*.trx

  frontend-qa:
    name: "QA Frontend (Angular 22)"
    needs: validate-source
    if: ${{ inputs.restart_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js desde .nvmrc"
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: "Validar versiones fijadas de Node y npm"
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "$(cat .npm-version)"

      - name: "Instalar dependencias npm"
        run: npm ci

      - name: "Verificar auditoría de dependencias y vulnerabilidades"
        run: npm run audit:check

      - name: "Compilar librería compartida"
        run: npm run build:shared

      - name: "Verificar linteo de frontend"
        run: npm run lint:web

      - name: "Compilar aplicación Web en Producción"
        run: npm run build:web

      - name: "Compilar aplicación Mobile en Producción"
        run: npm run build:mobile

      - name: "Conservar el reporte de auditoría"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.job }}
          path: artifacts/spec000/audit-ci.json
          if-no-files-found: warn

  build-backend:
    name: "Compilar y Publicar Backend (GHCR)"
    needs: [validate-source, backend-qa]
    if: ${{ inputs.restart_only != true }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Definir variables de tag"
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Autenticar en GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compilar y pushear imagen Docker del Backend"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-backend:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: "Compilar y Publicar Frontend Web (GHCR)"
    needs: [validate-source, frontend-qa]
    if: ${{ inputs.restart_only != true }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Definir variables de tag"
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: "Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Autenticar en GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compilar y pushear imagen Docker del Frontend"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-web:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/istpetdev-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: "Despliegue Inmutable en Servidor EC2"
    needs: [validate-source, build-backend, build-frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.restart_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código para sincronizar configuraciones"
        uses: actions/checkout@v4

      - name: "Preparar Host y Dependencias (Idempotente)"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/istpetdev
            sudo chown -R $USER:$USER /var/www/istpetdev
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker Engine en nuevo host..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes 2>/dev/null || true
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null || true
              sudo apt-get update -y || true
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin || sudo apt-get install -y docker.io docker-compose
              sudo usermod -aG docker $USER || true
            fi

      - name: "Transferir archivos de configuración (Compose y Nginx) al Servidor"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/compose/docker-compose.prod.yml,infra/nginx/istpetdev.conf"
          target: "${{ env.DEPLOY_DIR }}/"
          strip_components: 0

      - name: "Ejecutar orquestación de despliegue en el Host"
        uses: appleboy/ssh-action@v1.2.0
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST || 'istpetdev-rds-dev.cep4osawemm3.us-east-1.rds.amazonaws.com' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME || 'istpetdev_integration' }}
          DB_USER: ${{ secrets.DB_USER || 'migrator_integration' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL_MODE: ${{ secrets.DB_SSL_MODE || 'VerifyFull' }}
          COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          COGNITO_WEB_CLIENT_ID: ${{ vars.COGNITO_WEB_CLIENT_ID }}
          COGNITO_MOBILE_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID }}
          COGNITO_M2M_CLIENT_ID: ${{ vars.COGNITO_M2M_CLIENT_ID }}
          AUTHENTICATION_TECHNICAL_READ_SCOPE: ${{ vars.AUTHENTICATION_TECHNICAL_READ_SCOPE || 'istpetdev-api/automation' }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'false' }}
          AGENT_AUTO_ON_INCIDENT: ${{ vars.AGENT_AUTO_ON_INCIDENT || 'true' }}
          AGENT_TIMEOUT_SECONDS: ${{ vars.AGENT_TIMEOUT_SECONDS || '10' }}
          AGENT_POLL_MILLISECONDS: ${{ vars.AGENT_POLL_MILLISECONDS || '250' }}
          AGENT_N8N_WEBHOOK_URL: ${{ vars.AGENT_N8N_WEBHOOK_URL || 'https://n8n.bryan-bano.com/webhook/istpetdev/agent' }}
          AGENT_N8N_WEBHOOK_SECRET: ${{ secrets.AGENT_N8N_WEBHOOK_SECRET }}
          AGENT_N8N_API_BASE_URL: ${{ vars.AGENT_N8N_API_BASE_URL || 'https://istpetdev.doicela.dev/api/v1' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OWNER,COMMIT_SHA,GH_ACTOR,GH_TOKEN,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,DB_SSL_MODE,COGNITO_AUTHORITY,COGNITO_WEB_CLIENT_ID,COGNITO_MOBILE_CLIENT_ID,COGNITO_M2M_CLIENT_ID,AUTHENTICATION_TECHNICAL_READ_SCOPE,AGENT_ENABLED,AGENT_AUTO_ON_INCIDENT,AGENT_TIMEOUT_SECONDS,AGENT_POLL_MILLISECONDS,AGENT_N8N_WEBHOOK_URL,AGENT_N8N_WEBHOOK_SECRET,AGENT_N8N_API_BASE_URL
          script: |
            set -e
            cd /var/www/istpetdev

            # 1. Asegurar directorios operativos y certificados SSL
            mkdir -p releases infra/compose infra/nginx/certs
            if [ ! -f infra/nginx/certs/istpetdev.crt ]; then
              echo "Generando certificado SSL autofirmado de compatibilidad para Nginx..."
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout infra/nginx/certs/istpetdev.key \
                -out infra/nginx/certs/istpetdev.crt \
                -subj "/C=EC/ST=Pichincha/L=Quito/O=IstpetDev/CN=istpetdev.doicela.dev" 2>/dev/null || true
            fi

            # 2. Mantenimiento preventivo de disco del Host
            sudo journalctl --vacuum-size=50M 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            # 3. Autenticación en GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-backend:${COMMIT_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/istpetdev-web:${COMMIT_SHA}"

            # Verificacion estricta de artefactos inmutables en GHCR (Fail-Fast sin fallbacks ciegos)
            if ! docker manifest inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
              echo "Error critico: La imagen inmutable de backend no existe en GHCR: $BACKEND_IMAGE"
              exit 1
            fi
            if ! docker manifest inspect "$FRONTEND_IMAGE" >/dev/null 2>&1; then
              echo "Error critico: La imagen inmutable de frontend no existe en GHCR: $FRONTEND_IMAGE"
              exit 1
            fi
            if [ -z "$DB_PASSWORD" ] && [ -f .env ]; then
              echo "Cargando DB_PASSWORD desde archivo .env persistente en host..."
              export DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2-)
            fi
            export DB_HOST="${DB_HOST:-istpetdev-rds-dev.cep4osawemm3.us-east-1.rds.amazonaws.com}"
            export DB_PORT="${DB_PORT:-5432}"
            export DB_NAME="${DB_NAME:-istpetdev_integration}"
            export DB_USER="${DB_USER:-migrator_integration}"
            export DB_PASSWORD="$DB_PASSWORD"
            export DB_SSL_MODE="${DB_SSL_MODE:-VerifyFull}"
            export APPLY_MIGRATIONS="${APPLY_MIGRATIONS:-true}"
            # Inicio de configuración del agente
            export COGNITO_M2M_CLIENT_ID="${COGNITO_M2M_CLIENT_ID:-}"
            export AUTHENTICATION_TECHNICAL_READ_SCOPE="${AUTHENTICATION_TECHNICAL_READ_SCOPE:-istpetdev-api/automation}"
            export AGENT_ENABLED="${AGENT_ENABLED:-false}"
            export AGENT_AUTO_ON_INCIDENT="${AGENT_AUTO_ON_INCIDENT:-true}"
            export AGENT_TIMEOUT_SECONDS="${AGENT_TIMEOUT_SECONDS:-10}"
            export AGENT_POLL_MILLISECONDS="${AGENT_POLL_MILLISECONDS:-250}"
            export AGENT_N8N_WEBHOOK_URL="${AGENT_N8N_WEBHOOK_URL:-https://n8n.bryan-bano.com/webhook/istpetdev/agent}"
            export AGENT_N8N_WEBHOOK_SECRET="${AGENT_N8N_WEBHOOK_SECRET:-}"
            export AGENT_N8N_API_BASE_URL="${AGENT_N8N_API_BASE_URL:-https://istpetdev.doicela.dev/api/v1}"
            case "$AGENT_ENABLED" in
              true)
                if [ -z "$COGNITO_M2M_CLIENT_ID" ] || [ -z "$AGENT_N8N_WEBHOOK_URL" ] || [ -z "$AGENT_N8N_WEBHOOK_SECRET" ]; then
                  echo 'Configurar COGNITO_M2M_CLIENT_ID, AGENT_N8N_WEBHOOK_URL y AGENT_N8N_WEBHOOK_SECRET antes de activar el agente.' >&2
                  exit 1
                fi
                ;;
              false) ;;
              *) echo 'AGENT_ENABLED debe ser true o false.' >&2; exit 1 ;;
            esac
            # Fin de configuración del agente

            # 4. Descarga de imágenes requeridas
            echo "Descargando imágenes inmutables..."
            docker compose -f infra/compose/docker-compose.prod.yml pull --quiet

            # 5. Asegurar arranque y disponibilidad de Redis
            docker compose -f infra/compose/docker-compose.prod.yml up -d istpetdev-redis

            # 6. Recreación atómica de servicios de aplicación y proxy inverso
            echo "Actualizando servicios de aplicación..."
            docker compose -f infra/compose/docker-compose.prod.yml up -d --force-recreate --remove-orphans istpetdev-backend istpetdev-web istpetdev-proxy

            # 7. Mantenimiento y rotación de imágenes (Retención de últimas 3 versiones para rollback)
            docker image prune -f
            for img in istpetdev-backend istpetdev-web; do
              docker images --filter "reference=*${img}*" --format "{{.ID}}" | sort -u | tail -n +4 | xargs -r docker rmi -f 2>/dev/null || true
            done

            # 8. Verificación estricta de readiness (Conexión a Amazon RDS y migraciones aplicadas)
            echo "Comprobando endpoint de readiness de la API (/health/ready)..."
            READY=false
            for i in $(seq 1 15); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/health/ready || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                READY=true
                echo "API IstpetDev verificada y conectada a RDS exitosamente en el intento $i (HTTP 200)."
                break
              fi
              echo "Esperando readiness de la API y migraciones de BD (intento $i/15, status=$HTTP_STATUS)..."
              sleep 4
            done

            if [ "$READY" != "true" ]; then
              echo "Error critico: La API no alcanzo estado READY (PostgreSQL/RDS o migraciones no disponibles)."
              echo "--- Ultimos logs de istpetdev-backend ---"
              docker compose -f infra/compose/docker-compose.prod.yml logs --tail=80 istpetdev-backend
              exit 1
            fi

  health-check-report:
    name: "Reporte Ejecutivo Post-Despliegue"
    needs: [deploy-ec2]
    runs-on: ubuntu-latest
    steps:
      - name: "Publicar reporte en GitHub Step Summary"
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Reporte Ejecutivo de Despliegue CI/CD — IstpetDev

          | Parámetro | Valor |
          | :--- | :--- |
          | **Estado** | Despliegue Exitoso en Servidor Cloud |
          | **Dominio Público** | [https://istpetdev.doicela.dev](https://istpetdev.doicela.dev) |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Desplegado por** | @${{ github.actor }} |
          | **Rama** | `${{ github.ref_name }}` |
          | **Verificación Base de Datos** | Exitoso (HTTP 200 en `/health/ready`) |

          ### Servicios en Ejecución:
          - **Frontend Web SPA**: `istpetdev-web` servido por Nginx Reverse Proxy.
          - **PWA de Campo**: Servida en `/campo/` dentro de la imagen `istpetdev-web` con Service Worker y soporte offline.
          - **Backend API**: `istpetdev-backend` (.NET 8 Web API en puerto 5000 interno).
          - **Base de Datos**: Amazon RDS PostgreSQL 16 (`istpetdev-rds-dev` conectada y migrada).
          - **Caché y Mensajería**: `istpetdev-redis` (Redis 7.4).
          - **CDN / WAF**: Cloudflare SSL Termination hacia `istpetdev.doicela.dev`.
          EOF
